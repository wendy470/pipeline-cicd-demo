name: Pipeline CI/CD Complet

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  IMAGE_NAME: monapp
  IMAGE_TAG: ${{ github.sha }}

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

  tests:
    name: Tests Unitaires
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install pytest pytest-cov
      - run: pytest tests/ --cov=src --cov-fail-under=80 -v

  qualite:
    name: Analyse Qualite
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - run: pip install flake8 bandit
      - run: flake8 src/ --extend-ignore=E302,E303 || true
      - run: bandit -r src/ -ll || true

  docker-build:
    name: Build Image Docker
    runs-on: ubuntu-latest
    needs: qualite
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t monapp:latest .

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - run: echo "Deploiement staging OK"

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    steps:
      - run: echo "Deploiement production OK"
